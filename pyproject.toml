[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-mineru"
dynamic = ["version"]
description = "MinerU remote OCR parser plugin for Paperless-ngx 3.x (searchable archive PDFs with text layer)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["paperless", "paperless-ngx", "mineru", "ocr", "parser", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Everything below already ships with the Paperless-ngx 3.x image; versions
# are kept loose so installing the plugin never up/downgrades Paperless deps.
dependencies = [
    "httpx>=0.27",
    "pikepdf>=9",
    "img2pdf>=0.5",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "pdfminer.six>=20231228", "ocrmypdf>=17.12", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Pacman1984/paperless-ngx-mineru-plugin"
Issues = "https://github.com/Pacman1984/paperless-ngx-mineru-plugin/issues"

[project.entry-points."paperless_ngx.parsers"]
mineru = "paperless_mineru.parser:MineruDocumentParser"

[tool.setuptools.dynamic]
version = { attr = "paperless_mineru.__version__" }

[tool.setuptools.packages.find]
include = ["paperless_mineru*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
